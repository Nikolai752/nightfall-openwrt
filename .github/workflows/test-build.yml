name: Test build archive

on:
  push:
    branches:
      - fix/unified-device-identity
      - fix/ui-menu-save-dhcp-backup-errors
      - feat/router-log-center
      - feat/router-log-intelligent-diagnostics
      - test/router-issues-bundle-v1.30.1-alpha.1
  workflow_dispatch:
    inputs:
      version:
        description: "Версия тестового архива"
        required: true
        type: string
        default: "v1.30.2-alpha.1-issues-211-200-83"

permissions:
  contents: read

jobs:
  build:
    name: Build test archive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v7

      - name: Подготовить официальный компилятор переводов LuCI
        run: |
          PO2LMO_PATH="$(sh tools/prepare-po2lmo.sh)"
          echo "PO2LMO=$PO2LMO_PATH" >> "$GITHUB_ENV"

      - name: Build archive
        env:
          VERSION: ${{ inputs.version || 'v1.30.2-alpha.1-issues-211-200-83' }}
        run: sh ./build-release.sh

      - name: Verify archive and checksum
        run: |
          test -s dist/nightfall-root.tar.gz
          test -s dist/nightfall-root.tar.gz.sha256
          (cd dist && sha256sum -c nightfall-root.tar.gz.sha256)
          tar -tzf dist/nightfall-root.tar.gz | grep -q 'www/luci-static/nightfall/version.json'
          tar -xOf dist/nightfall-root.tar.gz ./www/luci-static/nightfall/version.json

      - name: Upload installable archive
        uses: actions/upload-artifact@v7
        with:
          name: nightfall-test-v1.30.2-alpha.1-issues-211-200-83
          path: |
            dist/nightfall-root.tar.gz
            dist/nightfall-root.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
