name: PR 199 isolated test build

on:
  push:
    branches:
      - test/pr-199-final

permissions:
  contents: read

jobs:
  build:
    name: Build and verify Nightfall archive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated test branch
        uses: actions/checkout@v4
      - name: Build archive
        env:
          VERSION: v1.29.0-pr199-test
        run: sh ./build-release.sh
      - name: Verify archive and checksum
        run: |
          test -s dist/nightfall-root.tar.gz
          test -s dist/nightfall-root.tar.gz.sha256
          (cd dist && sha256sum -c nightfall-root.tar.gz.sha256)
          tar -tzf dist/nightfall-root.tar.gz | grep -q 'www/luci-static/nightfall/version.json'
          tar -xOf dist/nightfall-root.tar.gz ./www/luci-static/nightfall/version.json
      - name: Upload installable archive
        uses: actions/upload-artifact@v4
        with:
          name: nightfall-pr199-full-v1.29.0-test
          path: |
            dist/nightfall-root.tar.gz
            dist/nightfall-root.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
