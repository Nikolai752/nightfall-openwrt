name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: ./tools/check.sh
      - name: Тесты бота (без Telegram)
        run: sh tools/test-bot.sh
      - name: Тесты установки, обновления и удаления
        run: sh tools/test-install.sh
      - name: Дымовой тест (Playwright)
        run: |
          npm install --no-save playwright@1.49.0
          npx playwright install --with-deps chromium
          node tools/smoke.js
          node tools/smoke-layout.js
          node tools/smoke-login.js
          node tools/smoke-widget.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: tools/out/
