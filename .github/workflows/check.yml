name: check

on:
  pull_request:
  push:
    branches: [main, feature/tg-bot-center-universal]
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Подготовить официальный компилятор переводов LuCI
        run: |
          PO2LMO_PATH="$(sh tools/prepare-po2lmo.sh)"
          echo "PO2LMO=$PO2LMO_PATH" >> "$GITHUB_ENV"

      # Fast static checks and focused regression tests.
      - name: Static checks and traffic regression tests
        run: ./tools/check.sh

      # Functional tests run against isolated temporary roots; no router or Telegram account required.
      - name: Проверка службы и скриптов мониторинга
        run: sh tools/test-service.sh

      - name: Проверка постоянного хранилища
        run: sh tools/test-persist.sh

      - name: Тесты бота без Telegram
        run: sh tools/test-bot.sh

      - name: Изоляция маршрута Telegram (Steer и обычный VPN)
        run: sh tools/test-telegram-route.sh

      - name: История температур по датчикам
        run: sh tools/test-temps.sh

      - name: Безопасность и диагностика
        run: sh tools/test-sec.sh

      - name: Резервное копирование и восстановление
        run: sh tools/test-backup.sh

      - name: Расписание блокировки
        run: sh tools/test-block.sh

      - name: Учёт трафика LAN-клиентов
        run: sh tools/test-device-accounting.sh

      - name: Идентификация устройств и клиентов за репитером
        run: node tools/test-monitor-device-identity.js

      - name: Большие счётчики в истории JSON
        run: node tools/test-history-devdaily.js

      - name: Окно «Что нового»
        run: sh tools/test-whats-new.sh

      - name: Обновление LuCI и безопасный откат
        run: sh tools/test-updater.sh

      - name: Установка, обновление и удаление
        run: sh tools/test-install.sh

      # Browser-level checks own visual/layout assertions; avoid matching implementation strings in unit tests.
      - name: Браузерные smoke-тесты LuCI
        run: |
          npm install --no-save playwright@1.49.0
          npx playwright install --with-deps chromium
          node tools/smoke.js
          node tools/smoke-layout.js
          node tools/smoke-login.js
          node tools/smoke-widget.js
          node tools/smoke-monitor.js
          node tools/smoke-overview.js
          node tools/test-temp.js

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-screenshots
          path: tools/out/
          if-no-files-found: warn
          retention-days: 7
