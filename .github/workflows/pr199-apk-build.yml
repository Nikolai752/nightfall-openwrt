name: Build PR 199 OpenWrt APKs

on:
  push:
    branches:
      - ci/pr199-apk-build

permissions:
  contents: read

concurrency:
  group: pr199-apk-build
  cancel-in-progress: true

jobs:
  build:
    name: Build Nightfall APKs (OpenWrt 25.12.6 / mediatek-filogic)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENWRT_VERSION: "25.12.6"
      TARGET: "mediatek/filogic"
      SOURCE_REPO: "ntbowen/nightfall-openwrt"
      SOURCE_REF: "8c18704ae226799bdf101248a8f5ee9287da393b"
      SDK_ARCHIVE: "openwrt-sdk-25.12.6-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst"
      SDK_SHA256: "1c04ac47bdfc361d6aab299eb520d570e368013dedcb8d29cf39dc7168ae642e"

    steps:
      - name: Checkout CI workflow
        uses: actions/checkout@v4

      - name: Checkout exact PR 199 source commit
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          path: source
          persist-credentials: false

      - name: Verify source revision
        run: |
          set -euo pipefail
          ACTUAL="$(git -C source rev-parse HEAD)"
          test "$ACTUAL" = "$SOURCE_REF"
          echo "PR source: $SOURCE_REPO@$ACTUAL" | tee source-revision.txt

      - name: Install SDK host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            rsync unzip zlib1g-dev file wget zstd

      - name: Download and verify OpenWrt SDK
        run: |
          set -euo pipefail
          wget -q "https://downloads.openwrt.org/releases/$OPENWRT_VERSION/targets/$TARGET/$SDK_ARCHIVE"
          echo "$SDK_SHA256  $SDK_ARCHIVE" | sha256sum -c -
          mkdir sdk
          tar --zstd -xf "$SDK_ARCHIVE" -C sdk --strip-components=1
          test -d sdk/staging_dir/target-aarch64_cortex-a53_musl
          echo "SDK target architecture: aarch64_cortex-a53"

      - name: Prepare LuCI feed
        working-directory: sdk
        run: |
          set -euo pipefail
          ./scripts/feeds update luci packages
          ./scripts/feeds install -p luci luci-base
          ./scripts/feeds install -p packages coreutils

      - name: Add Nightfall package sources
        run: |
          set -euo pipefail
          mkdir -p sdk/package/luci-theme-nightfall sdk/package/luci-app-nightfall-monitor
          cp -a source/luci-theme-nightfall/. sdk/package/luci-theme-nightfall/
          cp -a source/luci-app-nightfall-monitor/. sdk/package/luci-app-nightfall-monitor/

      - name: Configure SDK
        working-directory: sdk
        run: make defconfig

      - name: Build theme APK
        working-directory: sdk
        run: make package/luci-theme-nightfall/compile V=s -j2

      - name: Build resource monitor APK
        working-directory: sdk
        run: make package/luci-app-nightfall-monitor/compile V=s -j2

      - name: Verify APKs and create checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          find sdk/bin/packages -type f -name 'luci-theme-nightfall_*.apk' -exec cp -v {} dist/ \;
          find sdk/bin/packages -type f -name 'luci-app-nightfall-monitor_*.apk' -exec cp -v {} dist/ \;
          test "$(find dist -maxdepth 1 -type f -name 'luci-theme-nightfall_*.apk' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name 'luci-app-nightfall-monitor_*.apk' | wc -l)" -eq 1
          file dist/*.apk
          sha256sum dist/*.apk > dist/SHA256SUMS
          {
            echo "OpenWrt: $OPENWRT_VERSION"
            echo "Target: $TARGET"
            echo "Architecture: aarch64_cortex-a53"
            echo "Source: $SOURCE_REPO@$SOURCE_REF"
            echo "PR: https://github.com/Nikolai752/nightfall-openwrt/pull/199"
          } > dist/BUILD-INFO.txt
          cat dist/BUILD-INFO.txt
          cat dist/SHA256SUMS

      - name: Upload installable APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nightfall-pr199-openwrt-25.12.6-mediatek-filogic
          path: dist/
          if-no-files-found: error
          retention-days: 14
