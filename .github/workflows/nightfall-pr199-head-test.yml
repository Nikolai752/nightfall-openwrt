name: Nightfall PR199 latest-head test archive
on:
  push:
    branches:
      - test/pr199-head-8c18704
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout matching LuCI translation compiler and base catalog
        uses: actions/checkout@v4
        with:
          repository: openwrt/luci
          ref: openwrt-25.12
          path: luci-src
          sparse-checkout: |
            modules/luci-base/src
            modules/luci-base/po/zh_Hans
      - name: Build LuCI po2lmo host utility
        run: make -C luci-src/modules/luci-base/src po2lmo
      - name: Build installable archive with Chinese translations
        env:
          VERSION: v1.29.0-pr199-head-test
          PO2LMO: ${{ github.workspace }}/luci-src/modules/luci-base/src/po2lmo
          LUCI_BASE_PO: ${{ github.workspace }}/luci-src/modules/luci-base/po/zh_Hans/base.po
        run: sh ./build-release.sh
      - name: Verify archive, checksum and journal translation entries
        run: |
          set -eu
          test -s dist/nightfall-root.tar.gz
          test -s dist/nightfall-root.tar.gz.sha256
          (cd dist && sha256sum -c nightfall-root.tar.gz.sha256)
          tar -tzf dist/nightfall-root.tar.gz | grep -q 'www/luci-static/nightfall/version.json'
          tar -xOf dist/nightfall-root.tar.gz ./www/luci-static/nightfall/version.json
          tar -tzf dist/nightfall-root.tar.gz | grep -q 'usr/libexec/nightfall-collector'
          tar -tzf dist/nightfall-root.tar.gz | grep -q 'usr/lib/lua/luci/i18n/base.zh-cn.lmo'
          tar -tzf dist/nightfall-root.tar.gz | grep -q 'usr/lib/lua/luci/i18n/nightfall.zh-cn.lmo'
          tar -tzf dist/nightfall-root.tar.gz | grep -q 'usr/lib/lua/luci/i18n/nightfall-monitor.zh-cn.lmo'
          mkdir -p /tmp/nightfall-verify
          tar -xzf dist/nightfall-root.tar.gz -C /tmp/nightfall-verify
          test -s /tmp/nightfall-verify/usr/lib/lua/luci/i18n/nightfall-monitor.zh-cn.lmo
          grep -q 'trEv(r\[3\])' luci-app-nightfall-monitor/htdocs/luci-static/resources/view/nightfall/monitor.js
          grep -q 'Роутер загружен' luci-app-nightfall-monitor/htdocs/luci-static/resources/view/nightfall/monitor.js
      - uses: actions/upload-artifact@v4
        with:
          name: nightfall-v1.29.0-pr199-head-test
          path: |
            dist/nightfall-root.tar.gz
            dist/nightfall-root.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
